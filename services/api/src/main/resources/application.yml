server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: socialtask-api
  datasource:
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/socialtask?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:socialtask}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  settings:
    master-key: ${SOCIALTASK_CONFIG_KEY:}
    llm-allowed-origins: ${SOCIALTASK_LLM_ALLOWED_ORIGINS:}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  upload-dir: ${APP_UPLOAD_DIR:./var/uploads}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
  followup:
    max-active-tasks: ${FOLLOWUP_MAX_ACTIVE_TASKS:10}
  wecom:
    enabled: ${WECOM_ENABLED:false}
    media-enabled: ${WECOM_MEDIA_ENABLED:false}
    oauth-enabled: ${WECOM_OAUTH_ENABLED:false}
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:0}
    secret: ${WECOM_AGENT_SECRET:}
    callback-enabled: ${WECOM_CALLBACK_ENABLED:false}
    callback-token: ${WECOM_CALLBACK_TOKEN:}
    encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
    retention-days: ${WECOM_RETENTION_DAYS:90}
    kf-enabled: ${WECOM_KF_ENABLED:false}
    kf-authorized: ${WECOM_KF_AUTHORIZED:false}
    kf-account-id: ${WECOM_KF_ACCOUNT_ID:}
    kf-secret: ${WECOM_KF_SECRET:}
    kf-retention-days: ${WECOM_KF_RETENTION_DAYS:30}
