name: socialtask
services:
  web:
    image: socialtask-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready',{signal:AbortSignal.timeout(20000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 25s
      start_period: 15s
  scheduler:
    image: socialtask-web:local
    restart: unless-stopped
    init: true
    command: ["node", "run-scheduler.mjs"]
    depends_on:
      web: {condition: service_healthy}
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SOCIALTASK_SCHEDULER_URL: http://web:3000/api/internal/scheduler
