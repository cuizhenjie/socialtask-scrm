name: socialtask
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialtask
      POSTGRES_USER: socialtask
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
    command: ["-c","timezone=UTC","-c","max_connections=100"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U socialtask -d socialtask"]
      interval: 10s
      retries: 15
      start_period: 20s
  # Local PostgREST so the API can be developed without a remote Supabase project.
  # Requires supabase/bootstrap.sql applied to the postgres service first.
  postgrest:
    image: public.ecr.aws/supabase/postgrest:latest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://socialtask:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/socialtask
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-socialtask-local-postgrest-secret}
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:54321:3000"
  api:
    build: ../services/api
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://postgrest:3000}
      SUPABASE_RPC_PATH: ${SUPABASE_RPC_PATH:-/rpc}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoicG9zdGdyZXMiLCJpc3MiOiJzb2NpYWx0YXNrLWxvY2FsIn0.KNroMTG_tButvrGtUmJGYFz3F7O7T-EwqWOk3w5AzFM}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SOCIALTASK_CONFIG_KEY: ${SOCIALTASK_CONFIG_KEY:-}
      SOCIALTASK_LLM_ALLOWED_ORIGINS: ${SOCIALTASK_LLM_ALLOWED_ORIGINS:-}
      APP_UPLOAD_DIR: /app/var/uploads
      ATTACHMENT_PM_RETENTION_DAYS: ${ATTACHMENT_PM_RETENTION_DAYS:-90}
      ATTACHMENT_CONTENT_RETENTION_DAYS: ${ATTACHMENT_CONTENT_RETENTION_DAYS:-0}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      FOLLOWUP_MAX_ACTIVE_TASKS: ${FOLLOWUP_MAX_ACTIVE_TASKS:-10}
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_MEDIA_ENABLED: ${WECOM_MEDIA_ENABLED:-false}
      WECOM_OAUTH_ENABLED: ${WECOM_OAUTH_ENABLED:-false}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-0}
      WECOM_AGENT_SECRET: ${WECOM_AGENT_SECRET:-}
      WECOM_CALLBACK_ENABLED: ${WECOM_CALLBACK_ENABLED:-false}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_RETENTION_DAYS: ${WECOM_RETENTION_DAYS:-90}
      WECOM_KF_ENABLED: ${WECOM_KF_ENABLED:-false}
      WECOM_KF_AUTHORIZED: ${WECOM_KF_AUTHORIZED:-false}
      WECOM_KF_ACCOUNT_ID: ${WECOM_KF_ACCOUNT_ID:-}
      WECOM_KF_SECRET: ${WECOM_KF_SECRET:-}
      WECOM_KF_RETENTION_DAYS: ${WECOM_KF_RETENTION_DAYS:-30}
    volumes:
      - upload_data:/app/var/uploads
    depends_on:
      postgrest: {condition: service_started}
    ports:
      - "127.0.0.1:8080:8080"
  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      api: {condition: service_started}
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres_data:
  upload_data:
