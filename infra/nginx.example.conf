# TLS ingress for the standalone Next.js app.
server {
    listen 80;
    server_name socialtask.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name socialtask.example.com;
    ssl_certificate /etc/letsencrypt/live/socialtask.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialtask.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 10m;

    # Signed Enterprise WeChat callback handled by Next.js.
    # CorpID / Token / EncodingAESKey are checked by the Next.js Route Handler.
    location = /api/v1/wecom/callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    # Keep private REST endpoints and the scheduler off public ingress.
    location ^~ /api/v1/ {
        return 404;
    }

    location = /api/internal/scheduler { return 404; }

    # Authentication & WeCom OAuth BFF routes: forbid caching and referrer leakage.
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
