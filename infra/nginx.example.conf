# Put TLS in front of the Next.js app; API and MySQL must not be exposed to the internet.
server {
    listen 443 ssl http2;
    server_name socialtask.example.com;
    ssl_certificate /etc/letsencrypt/live/socialtask.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialtask.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;
    # Only the signed Enterprise WeChat application callback may bypass Next.js.
    # CorpID / Token / EncodingAESKey signature verification happens in the Java API.
    location = /api/v1/wecom/callback {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
