name: SocialTask CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - name: Verify Next.js runtime against isolated PostgreSQL and HTTP fixtures
        run: python3 scripts/check-contract.py && node scripts/test-next-runtime.mjs
      - name: Verify ticket card login return and OAuth security
        run: node --experimental-strip-types scripts/check-login-return.mjs && node --experimental-strip-types scripts/check-wecom-oauth.mjs
      - run: npm audit --audit-level=high
        working-directory: apps/web
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test the 3COOL SocialTask plugin offline
        run: npm test --prefix plugins/dsh-socialtask
      - name: Package 3COOL Desktop plugin (offline)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/socialtask-plugin"
          npm --prefix plugins/dsh-socialtask run pack:desktop -- "$RUNNER_TEMP/socialtask-plugin" | tee "$RUNNER_TEMP/socialtask-plugin/pack.log"
      - uses: actions/upload-artifact@v4
        with:
          name: socialtask-desktop-plugin
          path: ${{ runner.temp }}/socialtask-plugin
          if-no-files-found: error
          retention-days: 14
